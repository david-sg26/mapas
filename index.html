<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapas de Território</title>
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--bd:#d9dde3;--pri:#2563eb;--ok:#16a34a;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#181e26;--tx:#e8ecf1;--mut:#97a1ae;--bd:#2a323d;--pri:#4c8dff;--ok:#34d399;--bad:#f87171}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{width:100%;max-width:440px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:12px;font-size:1rem;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
button{width:100%;padding:12px;margin-top:14px;font-size:1rem;border:0;border-radius:8px;background:var(--pri);color:#fff;font-weight:600}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--bd)}
button:disabled{opacity:.6}
.msg{margin-top:12px;font-size:.9rem;min-height:1.2em}
.err{color:var(--bad)}.okc{color:var(--ok)}
.hidden{display:none!important}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}
.nm{font-weight:600}.st{font-size:.8rem;color:var(--mut)}
.row .bt{display:flex;gap:6px}
.row button{width:auto;margin:0;padding:8px 10px;font-size:.85rem}
.row .no{background:var(--bad)}.row .yes{background:var(--ok)}

/* Área do mapa */
#telaApp{display:flex;flex-direction:column;height:100%}
.barra{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--bd)}
.barra strong{flex:1;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra button{width:auto;margin:0;padding:8px 12px;font-size:.85rem}
.filtros{display:flex;gap:8px;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--bd)}
.filtros select{padding:10px;font-size:.95rem}
#mapa{flex:1;min-height:200px}
#info{background:var(--card);border-top:1px solid var(--bd);padding:10px 12px;max-height:38%;overflow:auto}
#info .tit{font-weight:700;margin-bottom:6px}
.qs{display:flex;flex-wrap:wrap;gap:6px}
.qs a{display:inline-block;padding:8px 12px;border:1px solid var(--bd);border-radius:999px;color:var(--pri);text-decoration:none;font-weight:600;font-size:.9rem}
#painelAdmin{padding:12px;background:var(--bg);overflow:auto;max-height:50%}
.quadra-pin.feita{background:var(--ok)}
.qs a.feita{background:var(--ok);color:#fff;border-color:var(--ok)}
.qs button.qb{width:auto;margin:0;padding:8px 12px;border-radius:999px;font-size:.9rem;background:transparent;color:var(--pri);border:1px solid var(--bd)}
.qs button.qb.feita{background:var(--ok);color:#fff;border-color:var(--ok)}
.prog{font-size:.85rem;color:var(--mut);margin:4px 0 8px}
.sel{display:flex;gap:8px;margin-top:8px}
.sel button{margin:0;padding:8px 12px;font-size:.85rem;width:auto}
.sel button.bad{background:var(--bad)}
.liberar{margin-top:12px;padding-top:12px;border-top:1px solid var(--bd)}
.liberar input,.liberar select{margin-bottom:8px;padding:10px;font-size:.95rem}
.quadra-pin{background:var(--pri);color:#fff;border-radius:999px;font-size:11px;font-weight:700;width:22px;height:22px;line-height:22px;text-align:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
</style>
</head>
<body>

<div class="wrap" id="wrapLogin">
  <h1>Mapas de Território</h1>

  <div id="telaLogin" class="card">
    <label for="lNome">Nome</label>
    <input id="lNome" autocomplete="username">
    <label for="lSenha">Senha</label>
    <input id="lSenha" type="password" autocomplete="current-password">
    <button id="btnEntrar">Entrar</button>
    <button class="sec" id="irRegistro">Solicitar acesso</button>
    <div class="msg" id="msgLogin"></div>
  </div>

  <div id="telaRegistro" class="card hidden">
    <label for="rNome">Seu nome completo</label>
    <input id="rNome" autocomplete="name">
    <label for="rSenha">Escolha uma senha (mínimo 6 caracteres)</label>
    <input id="rSenha" type="password" autocomplete="new-password">
    <button id="btnRegistrar">Enviar pedido</button>
    <button class="sec" id="irLogin">Voltar</button>
    <div class="msg" id="msgReg"></div>
  </div>
</div>

<div id="telaApp" class="hidden">
  <div class="barra">
    <strong id="ola"></strong>
    <button class="sec" id="btnAdmin">Acessos</button>
    <button class="sec" id="btnSair">Sair</button>
  </div>
  <div id="painelAdmin" class="hidden">
    <strong>Pedidos e acessos</strong>
    <div id="listaAdmin"></div>
    <div class="liberar">
      <strong>Liberar alguém temporariamente</strong>
      <label for="lbNome">Nome (igual ao cadastro)</label>
      <input id="lbNome">
      <label for="lbFrente">Frente</label>
      <select id="lbFrente"></select>
      <label for="lbAte">Vale até</label>
      <input id="lbAte" type="date">
      <button id="btnLiberar">Liberar</button>
    </div>
    <div class="msg" id="msgAdm"></div>
  </div>
  <div class="filtros">
    <select id="selGrupo"></select>
    <select id="selMapa"></select>
  </div>
  <div id="mapa"></div>
  <div id="info"><div class="tit">Escolha um grupo e um mapa</div></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var API = "https://script.google.com/macros/s/AKfycbw0Qd_t6OxiVmr-mu_mvWdYSJhazM83FO6pmSwdvybdB2o3AlfVvxTBEdy7bEeCgzGe/exec";
var $ = function (id) { return document.getElementById(id); };
var sessao = null, dados = null, mapaLeaflet = null, camada = null;
var feitas = {}, pode = {}, mapaAtual = null;

var CACHE_KEY = "cacheMapas";
function lerCache() {
  try {
    var c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    return (c && sessao && c.nome === sessao.nome && c.dados) ? c.dados : null;
  } catch (e) { return null; }
}
function gravarCache(d) { try { localStorage.setItem(CACHE_KEY, JSON.stringify({ nome: sessao.nome, dados: d })); } catch (e) {} }
function limparCache() { try { localStorage.removeItem(CACHE_KEY); } catch (e) {} }

function lerSessao() { try { return JSON.parse(localStorage.getItem("sessao") || "null"); } catch (e) { return null; } }
function gravarSessao(s) { try { if (s) localStorage.setItem("sessao", JSON.stringify(s)); else localStorage.removeItem("sessao"); } catch (e) {} }

async function chamar(d) {
  try {
    var r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(d) });
    return await r.json();
  } catch (e) { return { ok: false, erro: "Sem conexão com o servidor. Tente de novo." }; }
}
function msg(el, t, ok) { el.textContent = t || ""; el.className = "msg " + (ok ? "okc" : "err"); }

function mostrarLogin(tela) {
  $("wrapLogin").classList.remove("hidden");
  $("telaApp").classList.add("hidden");
  $("telaLogin").classList.toggle("hidden", tela !== "login");
  $("telaRegistro").classList.toggle("hidden", tela !== "registro");
}

$("irRegistro").onclick = function () { mostrarLogin("registro"); };
$("irLogin").onclick = function () { mostrarLogin("login"); };

$("btnEntrar").onclick = async function () {
  var b = $("btnEntrar"); b.disabled = true; msg($("msgLogin"), "Entrando…", true);
  var r = await chamar({ acao: "login", nome: $("lNome").value, senha: $("lSenha").value });
  b.disabled = false;
  if (!r.ok) { msg($("msgLogin"), r.erro); return; }
  sessao = { token: r.token, nome: r.nome, admin: r.admin };
  gravarSessao(sessao); $("lSenha").value = ""; msg($("msgLogin"), "");
  abrirApp();
};

$("btnRegistrar").onclick = async function () {
  var b = $("btnRegistrar"); b.disabled = true; msg($("msgReg"), "Enviando…", true);
  var r = await chamar({ acao: "registrar", nome: $("rNome").value, senha: $("rSenha").value });
  b.disabled = false;
  if (!r.ok) { msg($("msgReg"), r.erro); return; }
  $("rSenha").value = ""; msg($("msgReg"), r.mensagem, true);
};

$("btnSair").onclick = function () {
  sessao = null; dados = null; gravarSessao(null); limparCache(); mostrarLogin("login");
};

$("btnAdmin").onclick = function () {
  var p = $("painelAdmin"); p.classList.toggle("hidden");
  if (!p.classList.contains("hidden")) carregarAdmin();
  setTimeout(function () { if (mapaLeaflet) mapaLeaflet.invalidateSize(); }, 50);
};

async function abrirApp() {
  $("wrapLogin").classList.add("hidden");
  $("telaApp").classList.remove("hidden");
  $("ola").textContent = "Olá, " + sessao.nome;
  $("btnAdmin").classList.toggle("hidden", !sessao.admin);
  $("painelAdmin").classList.add("hidden");
  iniciarMapa();

  // Dispara as duas consultas ao mesmo tempo (antes uma esperava a outra)
  var pDados = chamar({ acao: "dadosMapas", token: sessao.token });
  var pProg = chamar({ acao: "progresso", token: sessao.token });

  // Se já tem cópia guardada neste aparelho, mostra o mapa na hora
  var cache = lerCache();
  if (cache) { dados = cache; montarFiltros(); }

  var r = await pDados;
  if (!r.ok) {
    sessao = null; dados = null; gravarSessao(null); limparCache();
    mostrarLogin("login"); msg($("msgLogin"), r.erro || "Sessão expirada. Entre de novo.");
    return;
  }
  var mudou = !cache || JSON.stringify(cache) !== JSON.stringify(r);
  if (mudou) { dados = r; gravarCache(r); }

  aplicarProgresso(await pProg);

  if (!cache) montarFiltros();
  else if (mudou) refazerFiltros();
  else desenhar();
}

function refazerFiltros() {
  var g = $("selGrupo").value, m = $("selMapa").value;
  montarFiltros();
  $("selGrupo").value = g; preencherMapas();
  $("selMapa").value = m; desenhar();
}

function aplicarProgresso(r) {
  if (!r || !r.ok) return;
  feitas = {};
  r.feitas.forEach(function (f) {
    var k = f.frente + "|" + f.mapa;
    (feitas[k] = feitas[k] || {})[f.quadra] = f.por;
  });
  pode = r.pode || {};
}

async function carregarProgresso() {
  aplicarProgresso(await chamar({ acao: "progresso", token: sessao.token }));
}

function chave(m) { return m.g + "|" + m.n; }
function feitasDe(m) { return feitas[chave(m)] || {}; }

function iniciarMapa() {
  if (mapaLeaflet) { setTimeout(function () { mapaLeaflet.invalidateSize(); }, 50); return; }
  mapaLeaflet = L.map("mapa", { zoomControl: true, preferCanvas: true }).setView([-5.13, -42.83], 15);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "© OpenStreetMap"
  }).addTo(mapaLeaflet);
  camada = L.layerGroup().addTo(mapaLeaflet);
}

function montarFiltros() {
  var grupos = [];
  dados.mapas.forEach(function (m) { if (grupos.indexOf(m.g) < 0) grupos.push(m.g); });
  var sg = $("selGrupo"); sg.innerHTML = "";
  var op0 = document.createElement("option"); op0.value = ""; op0.textContent = "Todos os grupos"; sg.appendChild(op0);
  grupos.forEach(function (g) { var o = document.createElement("option"); o.value = g; o.textContent = g; sg.appendChild(o); });
  sg.onchange = function () { preencherMapas(); desenhar(); };
  $("selMapa").onchange = desenhar;
  var lf = $("lbFrente"); lf.innerHTML = "";
  grupos.forEach(function (g) { var o = document.createElement("option"); o.value = g; o.textContent = g; lf.appendChild(o); });
  preencherMapas(); desenhar();
}

$("btnLiberar").onclick = async function () {
  var b = $("btnLiberar"); b.disabled = true;
  var r = await chamar({ acao: "liberarTemporario", token: sessao.token, nome: $("lbNome").value, frente: $("lbFrente").value, ate: $("lbAte").value });
  b.disabled = false;
  if (!r.ok) { msg($("msgAdm"), r.erro); return; }
  $("lbNome").value = "";
  msg($("msgAdm"), "Permiss\u00e3o liberada.", true);
};

function preencherMapas() {
  var g = $("selGrupo").value, sm = $("selMapa"); sm.innerHTML = "";
  var op0 = document.createElement("option"); op0.value = ""; op0.textContent = "Todos os mapas"; sm.appendChild(op0);
  dados.mapas.forEach(function (m, i) {
    if (g && m.g !== g) return;
    var o = document.createElement("option"); o.value = String(i); o.textContent = "Mapa " + m.n; sm.appendChild(o);
  });
}

function linkGPS(lat, lng) { return "https://www.google.com/maps/search/?api=1&query=" + lat + "," + lng; }

function desenhar() {
  camada.clearLayers();
  var g = $("selGrupo").value, idx = $("selMapa").value;
  var lista = dados.mapas.filter(function (m, i) {
    if (idx !== "") return String(i) === idx;
    return !g || m.g === g;
  });
  var limites = [];
  lista.forEach(function (m) {
    if (m.c && m.c.length) {
      var poly = L.polygon(m.c, { color: "#2563eb", weight: 2, fillOpacity: 0.08 }).addTo(camada);
      poly.bindTooltip("Mapa " + m.n);
      poly.on("click", function () { mostrarInfo(m); });
      m.c.forEach(function (p) { limites.push(p); });
    }
    if (idx !== "") {
      Object.keys(m.q).forEach(function (q) {
        var ll = m.q[q];
        var cls = feitasDe(m)[q] ? "quadra-pin feita" : "quadra-pin";
        var ic = L.divIcon({ className: "", html: '<div class="' + cls + '">' + q + "</div>", iconSize: [22, 22] });
        L.marker(ll, { icon: ic }).addTo(camada).on("click", function () { window.open(linkGPS(ll[0], ll[1]), "_blank"); });
        limites.push(ll);
      });
    }
  });
  if (limites.length) mapaLeaflet.fitBounds(limites, { padding: [30, 30] });
  if (idx !== "") mostrarInfo(lista[0]);
  else $("info").innerHTML = '<div class="tit">Escolha um mapa para ver as quadras</div>';
  setTimeout(function () { mapaLeaflet.invalidateSize(); }, 50);
}

function mostrarInfo(m) {
  mapaAtual = m;
  var box = $("info"); box.innerHTML = "";
  var t = document.createElement("div"); t.className = "tit"; t.textContent = "Mapa " + m.n + " - " + m.g; box.appendChild(t);
  var qs = Object.keys(m.q).sort(function (a, b) { return a - b; });
  if (!qs.length) { box.appendChild(document.createTextNode("Sem quadras marcadas neste mapa.")); return; }
  var f = feitasDe(m), feitasN = qs.filter(function (q) { return f[q]; }).length;
  var p = document.createElement("div"); p.className = "prog";
  p.textContent = feitasN + " de " + qs.length + " quadras feitas" + (feitasN === qs.length ? " - mapa completo" : "");
  box.appendChild(p);
  var podeEste = !!pode[m.g];
  var dica = document.createElement("div"); dica.className = "st"; dica.style.marginBottom = "6px";
  dica.textContent = podeEste ? "Toque numa quadra para marcar como feita ou desmarcar:" : "Toque numa quadra para abrir o ponto no Google Maps:";
  box.appendChild(dica);
  var w = document.createElement("div"); w.className = "qs";
  qs.forEach(function (q) {
    var feita = !!f[q];
    if (podeEste) {
      var b = document.createElement("button"); b.className = "qb" + (feita ? " feita" : ""); b.textContent = "Q" + q + (feita ? " \u2713" : "");
      b.title = feita ? "Feita por " + f[q] : "";
      b.onclick = function () { marcar(m, q, !feita, b); };
      w.appendChild(b);
    } else {
      var a = document.createElement("a"); a.className = feita ? "feita" : ""; a.textContent = "Q" + q + (feita ? " \u2713" : "");
      a.href = linkGPS(m.q[q][0], m.q[q][1]); a.target = "_blank"; a.rel = "noopener";
      w.appendChild(a);
    }
  });
  box.appendChild(w);
  var sel = document.createElement("div"); sel.className = "sel";
  var gps = document.createElement("button"); gps.className = "sec"; gps.textContent = "Ponto de in\u00edcio no Google Maps";
  var primeira = qs.filter(function (q) { return !f[q]; })[0] || qs[0];
  gps.onclick = function () { window.open(linkGPS(m.q[primeira][0], m.q[primeira][1]), "_blank"); };
  sel.appendChild(gps);
  if (sessao.admin) {
    var rs = document.createElement("button"); rs.className = "bad"; rs.textContent = "Reiniciar mapa";
    rs.onclick = function () { reiniciar(m); };
    sel.appendChild(rs);
  }
  box.appendChild(sel);
}

async function marcar(m, q, feita, b) {
  b.disabled = true;
  var r = await chamar({ acao: "marcarQuadra", token: sessao.token, frente: m.g, mapa: m.n, quadra: q, feita: feita });
  if (!r.ok) { b.disabled = false; alert(r.erro); return; }
  await carregarProgresso();
  var ic = $("selMapa").value;
  desenhar();
  if (ic === "") mostrarInfo(m);
  if (r.completo) alert("Todas as quadras do mapa " + m.n + " foram marcadas. O admin foi avisado.");
}

async function reiniciar(m) {
  if (!confirm("Reiniciar o mapa " + m.n + "? Todas as quadras marcadas voltam a ficar pendentes.")) return;
  var r = await chamar({ acao: "reiniciarMapa", token: sessao.token, frente: m.g, mapa: m.n });
  if (!r.ok) { alert(r.erro); return; }
  await carregarProgresso();
  desenhar();
  mostrarInfo(m);
}

async function carregarAdmin() {
  var box = $("listaAdmin"); box.textContent = "Carregando…";
  var r = await chamar({ acao: "listarPendentes", token: sessao.token });
  if (!r.ok) { box.textContent = ""; msg($("msgAdm"), r.erro); return; }
  box.textContent = "";
  r.lista.forEach(function (u) {
    var st = String(u.status).toLowerCase();
    var row = document.createElement("div"); row.className = "row";
    var info = document.createElement("div");
    var n = document.createElement("div"); n.className = "nm"; n.textContent = u.nome;
    var s = document.createElement("div"); s.className = "st"; s.textContent = st;
    info.appendChild(n); info.appendChild(s); row.appendChild(info);
    if (st !== "admin") {
      var bt = document.createElement("div"); bt.className = "bt";
      if (st !== "aprovado") bt.appendChild(botao("Aprovar", "yes", u.nome, "aprovado"));
      if (st !== "bloqueado") bt.appendChild(botao("Bloquear", "no", u.nome, "bloqueado"));
      row.appendChild(bt);
    }
    box.appendChild(row);
  });
  if (!r.lista.length) box.textContent = "Nenhum pedido ainda.";
}

function botao(texto, cls, nome, status) {
  var b = document.createElement("button"); b.textContent = texto; b.className = cls;
  b.onclick = async function () {
    b.disabled = true;
    var r = await chamar({ acao: "definirStatus", token: sessao.token, nome: nome, status: status });
    if (!r.ok) { msg($("msgAdm"), r.erro); b.disabled = false; return; }
    msg($("msgAdm"), ""); carregarAdmin();
  };
  return b;
}

sessao = lerSessao();
if (sessao && sessao.token) abrirApp(); else mostrarLogin("login");
</script>
</body>
</html>
